<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GLITCH HUNT | RRASE ECE Technical Symposium</title>
    <!-- Instant Theme Loader (Zero FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('glitch_hunt_theme');
          if (saved === 'day') {
            document.documentElement.classList.add('theme-day');
            document.documentElement.setAttribute('data-theme', 'day');
          } else {
            document.documentElement.classList.add('dark', 'theme-night');
            document.documentElement.setAttribute('data-theme', 'night');
          }
        } catch(e) {
          document.documentElement.classList.add('dark', 'theme-night');
          document.documentElement.setAttribute('data-theme', 'night');
        }
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased overflow-x-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
